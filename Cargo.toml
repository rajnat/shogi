[package]
name = "shogi-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "shogi"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
tch = "0.24"
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
