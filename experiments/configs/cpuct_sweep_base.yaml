project: Shogi
run_name: cpuct_sweep
group: cpuct_sweep
seed: 42
rust_binary: target/release/shogi
build_release: true

wandb:
  enabled: true
  project: Shogi
  entity: rajnat
  mode: online
  tags: [cpuct-sweep]
  upload_artifacts: true
  upload_checkpoints: final_only

plateau:
  enabled: false
  opponent_kind: anchor
  patience_evals: 5
  min_elo_gain: 20
  min_step: 5000

train:
  channels: 64
  blocks: 6
  workers: 4
  sims: 100
  batch_size: 256
  min_buffer_size: 5000
  learning_rate: 0.001
  weight_decay: 0.0001
  c_puct: 1.0
  dirichlet_alpha: 0.15
  dirichlet_epsilon: 0.25
  temperature_high: 1.0
  temperature_low: 0.0
  temperature_drop_ply: 30
  max_moves: 256
  total_steps: 3000
  checkpoint_every: 250
  pit_games: 20
  log_every: 50
